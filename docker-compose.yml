name: adaptaid

# Development:        docker compose up -d db          (then `make dev`)
# Full stack locally: docker compose --profile full up -d --build      -> http://localhost:3000
# Production (VPS):   docker compose --profile prod up -d --build      -> Caddy on 80/443
x-api-env: &api-env
  APP_ENV: ${APP_ENV:-prod}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adaptaid}:${POSTGRES_PASSWORD:-adaptaid}@db:5432/${POSTGRES_DB:-adaptaid}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:-TEACH-2026}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
  JOB_HOUR: ${JOB_HOUR:-2}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adaptaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adaptaid}
      POSTGRES_DB: ${POSTGRES_DB:-adaptaid}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adaptaid} -d ${POSTGRES_DB:-adaptaid}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full", "prod"]
    image: adaptaid-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["full", "prod"]
    image: adaptaid-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
