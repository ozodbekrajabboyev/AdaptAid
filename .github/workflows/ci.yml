name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adaptaid
          POSTGRES_PASSWORD: adaptaid
          POSTGRES_DB: adaptaid
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U adaptaid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://adaptaid:adaptaid@localhost:5434/adaptaid
      TEST_DATABASE_URL: postgresql+psycopg://adaptaid:adaptaid@localhost:5434/adaptaid_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create the test database
        run: PGPASSWORD=adaptaid psql -h localhost -p 5434 -U adaptaid -d adaptaid -c "CREATE DATABASE adaptaid_test"
      - name: Install backend (same venv path as local)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend[dev]" pandas statsmodels
      - name: Migrate
        run: backend/.venv/bin/python -m app.cli migrate
        working-directory: .
        env:
          PYTHONPATH: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: make ci (lint, typecheck, tests, migration and API-schema drift checks, production build)
        run: make ci
